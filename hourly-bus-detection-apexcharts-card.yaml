type: custom:apexcharts-card
header:
  title: Detections — Last 12 Hours
graph_span: 12h
apex_config:
  chart:
    type: bar
  legend:
    show: true
    showForSingleSeries: true
  xaxis:
    type: datetime
    labels:
      format: HH:mm
series:
  - entity: sensor.frigate_hourly_detections
    name: Bus
    type: column
    color: '#E53935'
    show:
      legend_value: false
    data_generator: >
      return entity.attributes.timestamps.map((t, i) => [t,
      entity.attributes.bus[i]]);
